name: Tests

on:
  push:
    branches: [ main, mcp-support ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Run Tests
        run: xcodebuild -scheme Ollamac -destination 'platform=macOS' test
